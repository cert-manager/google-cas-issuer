apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cert-manager-google-cas-issuer.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "cert-manager-google-cas-issuer.labels" . | indent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "cert-manager-google-cas-issuer.name" . }}
  template:
    metadata:
      labels:
        {{- /*
          Merged as one map so no key can be emitted twice. "app" is listed
          first and so wins: it is the selector label above, and a pod label
          that does not match spec.selector.matchLabels is rejected by the
          API server. .Values.podLabels wins over .Values.commonLabels.
        */}}
        {{- $podLabels := merge
              (dict "app" (include "cert-manager-google-cas-issuer.name" .))
              (.Values.podLabels | default dict)
              (include "cert-manager-google-cas-issuer.labels" . | fromYaml)
        -}}
        {{- toYaml $podLabels | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }

    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ include "cert-manager-google-cas-issuer.name" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
      - name: {{ include "cert-manager-google-cas-issuer.name" . }}
        image: {{ include "cert-manager-google-cas-issuer.image" (tuple .Values.image .Values.imageRegistry .Values.imageNamespace (printf ":%s" .Chart.AppVersion)) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.app.metrics.port }}
        args:
          - --enable-leader-election
          - --log-level={{.Values.app.logLevel}}
          - --metrics-addr=:{{.Values.app.metrics.port}}
          {{- if gt (.Values.app.maxConcurrentReconciles | int) 1 }}
          - --max-concurrent-reconciles={{.Values.app.maxConcurrentReconciles}}
          {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}

        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          readOnlyRootFilesystem: true

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
